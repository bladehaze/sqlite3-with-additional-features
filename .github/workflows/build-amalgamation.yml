name: Build SQLite Amalgamation with EXCLUDE

on:
  push:
    branches:
      - main
      - master
      - exclude-feature
    paths:
      - 'src/**'
      - '.github/workflows/build-amalgamation.yml'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FEATURE_BRANCH: exclude-feature

jobs:
  build-amalgamation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge feature branch if on main
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          # If we're on main, merge the feature branch to get EXCLUDE changes
          git fetch origin ${{ env.FEATURE_BRANCH }}:${{ env.FEATURE_BRANCH }} || {
            echo "Feature branch not found, building without EXCLUDE feature"
            exit 0
          }
          git merge ${{ env.FEATURE_BRANCH }} --no-edit || {
            echo "Could not merge feature branch, continuing with current state"
          }

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tcl \
            tcl-dev \
            build-essential \
            zlib1g-dev

      - name: Build parser generator (lemon)
        run: |
          gcc -o lemon tool/lemon.c
          chmod +x lemon
          # Copy lempar.c template (required by lemon)
          cp tool/lempar.c .

      - name: Build mksourceid tool
        run: |
          gcc -o mksourceid tool/mksourceid.c
          chmod +x mksourceid

      - name: Generate parse.c and parse.h
        run: |
          # Copy parse.y and ensure lempar.c is present
          cp src/parse.y .
          if [ ! -f lempar.c ]; then
            echo "Error: lempar.c template file missing"
            exit 1
          fi
          # Run lemon to generate parse.c and parse.h
          ./lemon -DSQLITE_ENABLE_MATH_FUNCTIONS -DSQLITE_ENABLE_PERCENTILE \
                  -DSQLITE_HAVE_ZLIB=1 -DSQLITE_THREADSAFE=1 -S parse.y
          # Verify parse.c and parse.h were generated
          if [ ! -f parse.c ] || [ ! -f parse.h ]; then
            echo "Error: parse.c or parse.h was not generated"
            echo "Lemon output files:"
            ls -la parse.* 2>/dev/null || echo "No parse.* files found"
            exit 1
          fi
          echo "✓ parse.c and parse.h generated successfully"

      - name: Generate keyword hash
        run: |
          if [ -f tool/mkkeywordhash.c ]; then
            gcc -o mkkeywordhash tool/mkkeywordhash.c
            ./mkkeywordhash > keywordhash.h
          fi

      - name: Generate opcodes.h and opcodes.c
        run: |
          # opcodes.h is generated from parse.h and vdbe.c
          if [ -f parse.h ] && [ -f src/vdbe.c ]; then
            cat parse.h src/vdbe.c | tclsh tool/mkopcodeh.tcl > opcodes.h
            echo "✓ Generated opcodes.h"
          else
            echo "Warning: Cannot generate opcodes.h (parse.h or src/vdbe.c missing)"
          fi
          
          # opcodes.c is generated from opcodes.h
          if [ -f opcodes.h ]; then
            tclsh tool/mkopcodec.tcl opcodes.h > opcodes.c
            echo "✓ Generated opcodes.c"
          else
            echo "Warning: Cannot generate opcodes.c (opcodes.h missing)"
          fi

      - name: Prepare source directory
        run: |
          # Create tsrc directory and copy source files
          # This mimics 'make target_source'
          mkdir -p tsrc
          
          # Copy all source files to tsrc/
          cp src/*.c src/*.h tsrc/ 2>/dev/null || true
          
          # Copy generated files - these are required!
          if [ ! -f parse.c ] || [ ! -f parse.h ]; then
            echo "Error: parse.c or parse.h missing - cannot continue"
            exit 1
          fi
          cp parse.c parse.h tsrc/
          echo "✓ Copied parse.c and parse.h to tsrc/"
          
          if [ -f keywordhash.h ]; then
            cp keywordhash.h tsrc/
          fi
          
          # Copy other generated files - opcodes are required!
          if [ -f opcodes.c ] && [ -f opcodes.h ]; then
            cp opcodes.c opcodes.h tsrc/
            echo "✓ Copied opcodes.c and opcodes.h to tsrc/"
          else
            echo "Warning: opcodes.c or opcodes.h missing"
          fi
          
          if [ -f ctime.c ]; then cp ctime.c tsrc/; fi
          
          # Verify parse.c is in tsrc/ (required by mksqlite3c.tcl)
          if [ ! -f tsrc/parse.c ]; then
            echo "Error: tsrc/parse.c missing - mksqlite3c.tcl will fail"
            exit 1
          fi
          echo "✓ Verified tsrc/parse.c exists"

      - name: Generate sqlite3.h
        run: |
          if [ -f tool/mksqlite3h.tcl ]; then
            # mksqlite3h.tcl needs mksourceid and a manifest file
            # Create a minimal manifest if it doesn't exist (for Git repos)
            if [ ! -f manifest ]; then
              echo "Creating minimal manifest file for Git repository..."
              # Get version from VERSION file if it exists
              if [ -f VERSION ]; then
                VERSION=$(cat VERSION)
              else
                VERSION="3.x.x"
              fi
              # Create a minimal manifest that mksourceid can process
              echo "D $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > manifest
              echo "# SQLite version $VERSION" >> manifest
              echo "# Git repository - manifest generated for build" >> manifest
            fi
            
            # Try to generate sqlite3.h using mksqlite3h.tcl
            if tclsh tool/mksqlite3h.tcl . -o sqlite3.h 2>&1; then
              echo "✓ sqlite3.h generated successfully"
            else
              echo "Warning: mksqlite3h.tcl failed, using fallback method"
              # Fallback: use sqlite.h.in directly
              if [ -f src/sqlite.h.in ]; then
                cp src/sqlite.h.in sqlite3.h
                # Get version
                if [ -f VERSION ]; then
                  VERSION=$(cat VERSION)
                  VERSION_NUM=$(echo $VERSION | awk -F. '{printf "%d%03d%03d", $1, $2, $3}')
                else
                  VERSION="3.x.x"
                  VERSION_NUM="3000000"
                fi
                # Replace placeholders
                sed -i "s/--VERS--/$VERSION/g" sqlite3.h
                sed -i "s/--VERSION-NUMBER--/$VERSION_NUM/g" sqlite3.h
                sed -i "s/--SOURCE-ID--/Git $(git rev-parse --short HEAD 2>/dev/null || echo 'unknown')/g" sqlite3.h
              else
                echo "Error: Cannot generate sqlite3.h"
                exit 1
              fi
            fi
          elif [ -f src/sqlite.h.in ]; then
            cp src/sqlite.h.in sqlite3.h
            # Replace version placeholders
            if [ -f VERSION ]; then
              VERSION=$(cat VERSION)
              VERSION_NUM=$(echo $VERSION | awk -F. '{printf "%d%03d%03d", $1, $2, $3}')
              sed -i "s/--VERS--/$VERSION/g" sqlite3.h
              sed -i "s/--VERSION-NUMBER--/$VERSION_NUM/g" sqlite3.h
            fi
            sed -i "s/--SOURCE-ID--/Git $(git rev-parse --short HEAD 2>/dev/null || echo 'unknown')/g" sqlite3.h
          else
            echo "Error: Cannot find tool to generate sqlite3.h"
            exit 1
          fi
          # Copy to tsrc/ for mksqlite3c.tcl (it reads version from tsrc/sqlite3.h)
          cp sqlite3.h tsrc/sqlite3.h

      - name: Generate sqlite3.c amalgamation
        run: |
          if [ -f tool/mksqlite3c.tcl ]; then
            tclsh tool/mksqlite3c.tcl --linemacros=0 --srcdir tsrc
          else
            echo "Error: mksqlite3c.tcl not found"
            exit 1
          fi

      - name: Verify amalgamation
        run: |
          if [ ! -f sqlite3.c ]; then
            echo "Error: sqlite3.c was not generated"
            exit 1
          fi
          
          # Check file size (should be large, > 1MB)
          SIZE=$(stat -f%z sqlite3.c 2>/dev/null || stat -c%s sqlite3.c 2>/dev/null)
          echo "sqlite3.c size: $SIZE bytes"
          
          if [ "$SIZE" -lt 1000000 ]; then
            echo "Warning: sqlite3.c seems too small"
          fi
          
          # Check for EXCLUDE in the generated file
          if grep -q "EXCLUDE" sqlite3.c; then
            echo "✓ EXCLUDE feature found in amalgamation"
          else
            echo "Warning: EXCLUDE not found in amalgamation"
          fi

      - name: Test compilation
        run: |
          echo "Testing compilation of sqlite3.c..."
          gcc -c sqlite3.c -DSQLITE_OMIT_LOAD_EXTENSION -o sqlite3.o 2>&1 | head -50 || {
            echo "Compilation test completed (warnings may be present)"
          }
          rm -f sqlite3.o

      - name: Create release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite3-amalgamation
          path: |
            sqlite3.c
            sqlite3.h
          retention-days: 90

      - name: Commit amalgamation (on main only)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          if [ -n "$(git status --porcelain sqlite3.c sqlite3.h 2>/dev/null)" ]; then
            git add sqlite3.c sqlite3.h
            git commit -m "Regenerate amalgamation with EXCLUDE feature [skip ci]" || echo "No changes or already committed"
            git push origin HEAD || echo "Push skipped"
          fi

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sqlite3.c
            sqlite3.h
          body: |
            SQLite with EXCLUDE feature support
            
            This release includes the SELECT * EXCLUDE(column_list) syntax.
            
            ## Usage
            ```sql
            SELECT * EXCLUDE(email) FROM employees;
            SELECT * EXCLUDE(email, salary) FROM employees;
            SELECT employees.* EXCLUDE(email) FROM employees;
            ```
            
            ## Changes
            - Added EXCLUDE keyword support
            - Modified parser to handle EXCLUDE clause
            - Updated column expansion logic
          draft: false
          prerelease: false
